# Builds the knowledge-base website (kb/ + docs/) and publishes it to the gh-pages branch.
# GitHub Pages serves gh-pages at https://hsin-rui.github.io/music-gen/
name: kb-site
on:
  push:
    branches: [main, prototype/harmony-first]
    paths: ["kb/**", "docs/**", "site/**", ".github/workflows/kb-site.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: kb-site, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.8.2 jieba==0.42.1
      - run: python site/build.py
        env: {NO_MKDOCS_2_WARNING: "1"}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/_site
          force_orphan: true
